# 两阶段配置：
# 阶段1（备案前）：只有 80 反代，用服务器 IP 直接访问调试
# 阶段2（备案通过）：执行 certbot --nginx -d xiaoxueshuku.online
#   → certbot 会自动改造本文件（签证书、加 443、加 80→443 跳转），无需手动编辑
# setup-server.sh 会把 example.com 替换成你的域名

limit_req_zone $binary_remote_addr zone=gen:10m rate=2r/s;

# 公安备案评估项：日志含 源地址/源端口/目标地址/目标端口，留存 ≥180 天（见 logrotate）
log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'src_port=$remote_port dst=$server_addr:$server_port rt=$request_time';

server {
    listen 80;
    server_name xiaoxueshuku.online;
    access_log /var/log/nginx/pdf-access.log detailed;

    # 管理接口仅限本机调用（运维经 SSH 隧道或服务器上 curl）
    location ^~ /api/admin/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # 生成类接口限流：每 IP 2 次/秒，突发 5
    location /api/generate/ {
        limit_req zone=gen burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
